name: rr-trading-engine

x-backend: &backend
  build: {context: ., dockerfile: docker/backend.Dockerfile}
  image: rr-backend:latest
  env_file: .env
  environment:
    RR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    RR_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  volumes: [./secrets:/run/rr-secrets:ro]

services:
  postgres:
    image: postgres:16.6-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, retries: 10}
    networks: [internal]

  redis:
    image: redis:7.4.1-alpine3.20
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"], interval: 10s, retries: 10}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    networks: [internal]

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: "no"
    networks: [internal]

  api:
    <<: *backend
    restart: unless-stopped
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [internal, egress]

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os,sys;sys.exit(0 if redis.Redis.from_url(os.environ['RR_REDIS_URL']).exists('rr:worker:lock') else 1)\""]
      interval: 30s
      retries: 3
    networks: [internal, egress]

  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    image: rr-frontend:latest
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27.3-alpine3.20
    restart: unless-stopped
    depends_on: [api, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme:/var/www/acme:ro
    healthcheck: {test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/api/health || exit 1"], interval: 30s, retries: 3}
    networks: [internal, public]

volumes: {pgdata: {}, redisdata: {}}

networks:
  internal: {internal: true}   # databases are never reachable from outside
  egress: {}                   # api/worker -> Windows MT5 connector, Claude API, Telegram/SMTP
  public: {}                   # nginx only
